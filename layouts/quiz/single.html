<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} – {{ .Site.Title }}</title>
    <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
    <style>
        /* дополнительные стили для квиза, если не хочется засорять основной файл */
        .quiz-block { margin: 1.5rem 0; }
        .quiz-block h3 { margin-bottom: 0.75rem; }
        .quiz-options { list-style: none; padding: 0; }
        .quiz-options li { margin-bottom: 0.5rem; }
        .result-container { display: none; margin-top: 2rem; padding: 1.5rem; background: var(--card-bg); border-radius: 12px; box-shadow: var(--shadow); }
        .result-container.visible { display: block; }
        .result-character { font-size: 2rem; color: var(--secondary); }
    </style>
</head>
<body>
    <button id="theme-toggle" aria-label="Переключить тему">🌓</button>
    {{ partial "header.html" . }}
    <header class="page-header">
        <div class="container">
            <a href="{{ .Site.Home.Permalink }}" class="back-link">← На главную</a>
            <h1 class="page-title">{{ .Title }}</h1>
        </div>
    </header>

    <main class="container">
        <form id="quiz-form" class="content">
            <p>Ответь на 5 вопросов и узнай, кто из персонажей визуальной новеллы тебе ближе: Дима, Артём, Элли или Галя.</p>

            <!-- Вопросы будут вставлены через JS для чистоты, но можно и прямо здесь -->
            <div id="questions-container"></div>

            <button type="submit" class="quiz-submit" style="margin-top: 1.5rem; padding: 0.75rem 2rem; background: var(--gradient-main); color: white; border: none; border-radius: 8px; font-size: 1.1rem; cursor: pointer;">Узнать результат</button>
        </form>

        <div id="result" class="result-container">
            <h2>Твой персонаж: <span id="char-name" class="result-character"></span></h2>
            <p id="char-desc"></p>
            <button id="retry-btn" style="padding: 0.5rem 1.5rem; background: var(--gradient-accent); color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 1rem;">Пройти заново</button>
        </div>
    </main>

    <footer class="container">
        <p>&copy; {{ now.Format "2006" }} {{ .Site.Title }}. Все права защищены.</p>
    </footer>

    <script src="{{ "js/theme.js" | relURL }}"></script>
    <script src="{{ "js/quiz.js" | relURL }}"></script>
</body>
</html>
